<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a12" />
    <meta
      name="description"
      content="Manage Giant in the Discord servers where you have Administrator permission."
    />
    <title>Dashboard — Giant</title>
    <link rel="icon" type="image/png" href="/giant-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Giant home">
        <img src="/giant-logo.png" alt="" />
        <span>giant<span class="brand-period">.</span></span>
      </a>
      <a class="button button-small button-outline" href="/">Back to home</a>
    </header>
    <main class="document-main dashboard-main">
      <section class="dashboard-panel" aria-labelledby="dashboard-title">
        <div class="document-kicker">GIANT DASHBOARD</div>
        <h1 id="dashboard-title">Your servers<span>.</span></h1>
        <p class="document-intro">
          Sign in with Discord to manage settings for servers where you have Manage Server permission.
        </p>

        <div id="dashboard-user" class="dashboard-user" hidden>
          <img id="dashboard-user-avatar" src="/giant-logo.png" alt="" />
          <span id="dashboard-user-name"></span>
          <button id="dashboard-logout" class="dashboard-logout" type="button">Sign out</button>
        </div>

        <div id="dashboard-login">
          <button id="discord-login" class="button button-primary" type="button">
            Log in with Discord
          </button>
        </div>

        <p id="dashboard-status" class="dashboard-status" role="status" aria-live="polite">
          Sign in to load your servers.
        </p>

        <section id="dashboard-server-section" class="dashboard-server-section" aria-labelledby="server-list-title" hidden>
          <div class="dashboard-server-heading">
            <h2 id="server-list-title">Servers you can manage</h2>
            <span id="dashboard-server-count" class="dashboard-server-count"></span>
          </div>
          <div id="dashboard-server-list" class="dashboard-server-list"></div>
        </section>
      </section>
    </main>
    <footer class="site-footer">
      <a class="brand" href="/" aria-label="Giant home">
        <img src="/giant-logo.png" alt="" />
        <span>giant<span class="brand-period">.</span></span>
      </a>
      <nav class="footer-links" aria-label="Legal links">
        <a href="/tos/">Terms of Use</a>
        <a href="/privacy/">Privacy Policy</a>
      </nav>
    </footer>
    <script src="/directory-config.js"></script>
    <script src="/dashboard/dashboard.js"></script>
  </body>
</html>
