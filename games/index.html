<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a12" />
    <title>Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="polytrack-page">
    <header class="polytrack-header games-header">
      <h1>Games</h1>
    </header>
    <main class="polytrack-main games-main">
      <div class="games-controls">
        <label for="game-select">Choose a game</label>
        <select id="game-select">
          <option value="https://nintendoboi22.github.io/games/poly-track/">PolyTrack</option>
          <option value="https://nintendoboi22.github.io/games/stickman-hook">Stickman Hook</option>
          <option value="https://nintendoboi22.github.io/games/snake-io">Snake.io</option>
          <option value="https://nintendoboi22.github.io/games/crossy-road">Crossy Road</option>
          <option value="https://nintendoboi22.github.io/games/drift-hunters">Drift Hunters</option>
          <option value="https://nintendoboi22.github.io/games/flappy-birb">Flappy Birb</option>
          <option value="https://nintendoboi22.github.io/games/retro-bowl">Retro Bowl</option>
          <option value="https://nintendoboi22.github.io/games/REAL-FS">Flight Sim</option>
        </select>
        <button class="button button-small button-outline" id="fullscreen-game" type="button">
          Fullscreen
        </button>
        <span class="games-fullscreen-status" id="fullscreen-status" role="status" hidden></span>
      </div>
      <iframe
        class="polytrack-frame games-frame"
        src="https://nintendoboi22.github.io/games/poly-track/"
        title="PolyTrack game"
        allow="fullscreen; gamepad"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
      <p class="polytrack-fallback games-fallback">
        If the game does not load here, it may not support embedding.
      </p>
    </main>
    <script>
      const gameSelect = document.getElementById("game-select");
      const gameFrame = document.querySelector(".games-frame");
      const fullscreenButton = document.getElementById("fullscreen-game");
      const fullscreenStatus = document.getElementById("fullscreen-status");

      gameSelect.addEventListener("change", () => {
        const gameName = gameSelect.options[gameSelect.selectedIndex].text;
        gameFrame.src = gameSelect.value;
        gameFrame.title = `${gameName} game`;
      });

      fullscreenButton.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement === gameFrame) {
            await document.exitFullscreen();
          } else {
            await gameFrame.requestFullscreen();
          }
          fullscreenStatus.hidden = true;
          fullscreenStatus.textContent = "";
        } catch {
          fullscreenStatus.textContent = "Fullscreen is unavailable in this browser.";
          fullscreenStatus.hidden = false;
        }
      });

      document.addEventListener("fullscreenchange", () => {
        fullscreenButton.textContent =
          document.fullscreenElement === gameFrame ? "Exit fullscreen" : "Fullscreen";
      });
    </script>
  </body>
</html>
