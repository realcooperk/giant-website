<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a12" />
    <title>PolyTrack — Giant</title>
    <link rel="icon" type="image/png" href="/giant-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="polytrack-page">
    <header class="polytrack-header">
      <a class="brand" href="/" aria-label="Giant home">
        <img src="/giant-logo.png" alt="" />
        <span>giant<span class="brand-period">.</span></span>
      </a>
      <h1>PolyTrack</h1>
      <a
        class="button button-small button-outline polytrack-open"
        href="https://nintendoboi22.github.io/games/poly-track/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open game directly
      </a>
    </header>
    <main class="polytrack-main">
      <iframe
        class="polytrack-frame"
        src="https://nintendoboi22.github.io/games/poly-track/"
        title="PolyTrack game"
        allow="fullscreen; gamepad"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
      <p class="polytrack-fallback">
        If the game does not load here,
        <a href="https://nintendoboi22.github.io/games/poly-track/" target="_blank" rel="noopener noreferrer">
          open PolyTrack directly
        </a>.
      </p>
    </main>
  </body>
</html>
